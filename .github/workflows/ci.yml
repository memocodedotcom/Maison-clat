name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/production-readiness-plan

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type, lint, test, and build checks
        run: npm run check
